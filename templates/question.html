<!DOCTYPE html>
<html>
<head>
    <title>Interview Questions</title>
</head>

<body style="font-family: Arial; background-color:#f4f6f8;">

    <div style="
        width:60%;
        margin:50px auto;
        background:white;
        padding:40px;
        border-radius:10px;
        box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        text-align:center;
    ">

        <h1>Interview Questions</h1>

        <p style="font-weight:bold;">
            Time Left: <span id="time">20</span> seconds
        </p>

        <h3>Question 1</h3>

        <p>What is a List in Python?</p>

        <form method="POST">

            <textarea 
                name="answer"
                placeholder="Type your answer here..."
                style="
                    width:100%;
                    height:200px;
                    padding:10px;
                    font-size:16px;
                    border-radius:6px;
                    border:1px solid #ccc;
                "
            ></textarea>

            <br><br>

            <button 
                type="submit"
                style="
                    padding:12px 25px;
                    font-size:16px;
                    background-color:#3498db;
                    color:white;
                    border:none;
                    border-radius:6px;
                    cursor:pointer;
                "
            >
                Submit Answer
            </button>

        </form>

    </div>

    <!-- ✅ TIMER SCRIPT -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {

        let timeLeft = 20;
        const timerElement = document.getElementById("time");
        const form = document.querySelector("form");

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 5) {
                timerElement.style.color = "red";
            }

            if (timeLeft <= 0) {
                clearInterval(countdown);
                alert("Time is up!");
                if (form) form.submit();
            }

        }, 1000);

    });
    </script>

</body>
</html>
