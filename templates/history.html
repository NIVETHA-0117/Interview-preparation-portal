<!DOCTYPE html>
<html>
<head>
    <title>Interview History</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #3498db;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Interview History</h2>

    <table>
        <thead>
            <tr>
                <th>Interview Type</th>
                <th>Score</th>
            </tr>
        </thead>

        <tbody>
            {% for row in records %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</div>

</body>
</html>
